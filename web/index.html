<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lyra Dashboard</title>
		<link rel="icon" href="/favicon.ico" />
		<script>
			// Runs before first paint so neither the loader nor the app flashes the wrong theme.
			// vite.config.ts fills the %LYRA_…% placeholders from src/lib/theme-names.ts.
			(function () {
				var themes = '%LYRA_THEMES%'.split(',');
				var choice = null;
				try {
					choice = localStorage.getItem('%LYRA_THEME_STORAGE_KEY%');
				} catch (e) {}
				if (themes.indexOf(choice) < 0) {
					choice = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.dataset.theme = choice;
			})();
		</script>
		<style>
			/* Inlined so the loader paints before any JS or CSS bundle arrives. */
			#boot-loader {
				--loader-bg: #f4f4fa;
				--loader-fg: #2a2a40;
				--loader-track: #d8d8e6;
				--loader-accent: #5865f2;
				position: fixed;
				inset: 0;
				z-index: 1000;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.25rem;
				background: var(--loader-bg);
				color: var(--loader-fg);
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			}
			:root[data-theme='dark'] #boot-loader {
				--loader-bg: #1a1a2e;
				--loader-fg: #e0e0f0;
				--loader-track: #2e2e4a;
			}
			#boot-loader .name {
				margin: 0;
				font-size: 1.5rem;
				font-weight: 600;
			}
			#boot-loader .spinner {
				width: 2.5rem;
				height: 2.5rem;
				border: 4px solid var(--loader-track);
				border-top-color: var(--loader-accent);
				border-radius: 50%;
				animation: boot-spin 0.8s linear infinite;
			}
			@media (prefers-reduced-motion: reduce) {
				#boot-loader .spinner {
					animation-duration: 2.4s;
				}
			}
			@keyframes boot-spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<div id="boot-loader" role="status" aria-label="Loading Lyra Dashboard">
			<p class="name">Lyra Dashboard</p>
			<div class="spinner" aria-hidden="true"></div>
		</div>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
