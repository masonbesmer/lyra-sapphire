server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: 'youshallnotpass'
    sources:
      youtube: false # Disabled — replaced by youtube-source plugin below
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

    # Buffer configuration for improved playback stability
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

  # TEMP: emptied to stop a boot crash-loop. PluginManager.checkPluginForUpdates() hits
  # maven.lavalink.dev on every boot with no try/catch — when that network call fails, it
  # kills the whole app before it can start, even though the plugin jar is already cached
  # in the plugins/ dir and doesn't need downloading. Lavalink loads jars already present on
  # disk regardless of this list (see PluginManager.loadJars()), so this is safe short-term.
  # Restore once maven.lavalink.dev connectivity is confirmed stable:
  # plugins:
  #   - dependency: 'dev.lavalink.youtube:youtube-plugin:1.18.0'
  #     snapshot: false
  plugins: []
    # - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.5.0"
    #   repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - MWEB
      - WEB
      - TVHTML5_SIMPLY
      - ANDROID_VR
    clientOptions:
      MUSIC:
        playback: false
      WEB:
        playback: false

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ''
  environment: ''

logging:
  file:
    path: ./logs/

  level:
    root: INFO
    lavalink: INFO
    # TEMP diagnostic: surface per-client attempt detail (incl. blocked/empty responses) from the
    # youtube-source plugin on the next empty-result search. Remove once the empty-search root
    # cause is confirmed — see src/commands/music/play.ts logEmptySearchDiagnostics.
    dev.lavalink.youtube: DEBUG

  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
