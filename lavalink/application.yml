server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: 'youshallnotpass'
    sources:
      youtube: false # Disabled — replaced by youtube-source plugin below
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

    # Buffer configuration for improved playback stability
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

  # Restored 2026-08-22 and bumped 1.18.0 -> 1.18.2. The crash-loop this was disabled for
  # (checkPluginForUpdates() hitting maven.lavalink.dev with no try/catch, killing the app on
  # any network failure) was caused by the outbound DNS/bridge bug fixed in
  # fix/recreate-lyra-network-after-reboot on 2026-08-15 — this container's other outbound HTTPS
  # calls (youtubei.googleapis.com) are working fine now, so maven.lavalink.dev should be too.
  # The bump itself fixes real playback failures: 1.18.0's signature-cipher extraction can't
  # parse YouTube's current player script ("Must find sig function from script"), so every
  # client failed to load audio and tracks queued but never played.
  plugins:
    - dependency: 'dev.lavalink.youtube:youtube-plugin:1.18.2'
      snapshot: false
    # - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.5.0"
    #   repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - MWEB
      - WEB
      - TVHTML5_SIMPLY
      - ANDROID_VR
      # Only OAuth-compatible playback client (see plugin README's client table) - the OAuth
      # section below is otherwise a no-op for playback, only the other clients' metadata/search.
      - TV
    clientOptions:
      MUSIC:
        playback: false
      WEB:
        playback: false
    # YouTube's player-script obfuscation now changes faster than the plugin can track locally
    # (every playback client failed with "Must find sig function from script" even on 1.18.2,
    # the latest release — see lavalink-devs/youtube-source#225). Offload signature/n-param
    # deciphering to the maintainer's public yt-cipher instance instead of parsing base.js in-process.
    remoteCipher:
      url: 'https://cipher.kikkia.dev/'
      userAgent: 'lyra-sapphire'
    # The remote cipher fix above resolved signature deciphering, but YouTube's CDN now
    # separately 403s the actual stream request without proof of a real browser (PoToken).
    # OAuth is the maintainer-recommended fix (README: "Using OAuth Tokens") - no refreshToken
    # configured yet, so on first boot Lavalink will print a device-flow URL+code to these logs.
    # Once completed (with a burner Google account, not a primary one - see plugin README
    # warning), Lavalink logs a refresh token; that gets stored as the OAUTH_REFRESH_TOKEN
    # Komodo env var (not committed here) and referenced below so restarts skip the flow.
    oauth:
      enabled: true
      refreshToken: ${OAUTH_REFRESH_TOKEN:}

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ''
  environment: ''

logging:
  file:
    path: ./logs/

  level:
    root: INFO
    lavalink: INFO
    # TEMP diagnostic: surface per-client attempt detail (incl. blocked/empty responses) from the
    # youtube-source plugin on the next empty-result search. Remove once the empty-search root
    # cause is confirmed — see src/commands/music/play.ts logEmptySearchDiagnostics.
    dev.lavalink.youtube: DEBUG

  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
