services:
  lavalink:
    # Built from lavalink/Dockerfile - the stock lavalink image plus our application.yml.
    image: ghcr.io/masonbesmer/lyra-lavalink:latest
    container_name: lyra-lavalink
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - JAVA_OPTIONS=${JAVA_OPTIONS}
      - SERVER_PORT=${SERVER_PORT}
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD}
      # Resolves ${OAUTH_REFRESH_TOKEN:} in lavalink/application.yml's oauth block. Komodo's
      # stack environment has this stored as LAVALINK_OAUTH_REFRESH_TOKEN, not bare
      # OAUTH_REFRESH_TOKEN - the unprefixed version here previously resolved to empty.
      - OAUTH_REFRESH_TOKEN=${LAVALINK_OAUTH_REFRESH_TOKEN:-}
    volumes:
      # No application.yml mount - it is baked into the image (see lavalink/Dockerfile), so
      # there is no host copy to keep in sync. plugins/ is the plugin jar download cache and
      # logs/ is rollover output; both are container-written state, not config.
      - /mnt/user/appdata/lyra/lavalink/plugins:/opt/Lavalink/plugins
      - /mnt/user/appdata/lyra/lavalink/logs:/opt/Lavalink/logs
    networks:
      - lyra-net

  lyra-bot:
    container_name: lyra-bot
    restart: unless-stopped
    image: ghcr.io/masonbesmer/lyra-sapphire:latest
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - OWNERS=${OWNERS}
      - NODE_ENV=${NODE_ENV}
      - BULK_OVERWRITE_GUILD_IDS=${BULK_OVERWRITE_GUILD_IDS}
      - SQLITE_PATH=${SQLITE_PATH}
      - LAVALINK_NODE_NAME=${LAVALINK_NODE_NAME}
      - LAVALINK_HOST=${LAVALINK_HOST}
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
      - LAVALINK_SECURE=${LAVALINK_SECURE}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI}
      - API_PORT=${API_PORT}
      - DASHBOARD_ORIGIN=${DASHBOARD_ORIGIN}
      - LAVALINK_RECONNECT_TRIES=${LAVALINK_RECONNECT_TRIES}
      - LAVALINK_RECONNECT_INTERVAL=${LAVALINK_RECONNECT_INTERVAL}
      - LAVALINK_REST_TIMEOUT=${LAVALINK_REST_TIMEOUT}
    # depends_on:
    #   lavalink:
    #     condition: service_healthy
    volumes:
      - /mnt/user/appdata/lyra/data:/app/data
      - /mnt/user/appdata/lyra/recordings:/app/recordings
    networks:
      - lyra-net
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.lyra.entrypoints=https
      - traefik.http.routers.lyra.rule=Host(`lyra.latte.cx`)
      - traefik.http.routers.lyra.tls=true
      - traefik.http.services.lyra.loadbalancer.server.port=4000
      - nfrastack.herald.enable=true
    ports:
      - '4000:4000'

networks:
  traefik:
    external: true
  # Renamed from lyra-network (2026-08-15) so the deploy creates a fresh bridge
  # whose iptables FORWARD rules land above libvirt's — the old network lost all
  # outbound traffic after the 08-14 host reboot. See docs/incidents/2026-08-15-dns-outage.md
  lyra-net:
    driver: bridge
