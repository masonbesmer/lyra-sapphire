services:
  lavalink:
    # Built from lavalink/Dockerfile (stock lavalink + our application.yml) by the stack's
    # run_build at deploy time, rather than pulled from a registry - the config is a single
    # COPY onto a cached base, so this is seconds and needs no separate build resource.
    # Deliberately no `image:` key: with one set, the stack's auto_pull would try to pull a
    # tag that nothing publishes and fail the deploy before the build ever ran.
    build:
      context: .
      dockerfile: lavalink/Dockerfile
    container_name: lyra-lavalink
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - JAVA_OPTIONS=${JAVA_OPTIONS}
      - SERVER_PORT=${SERVER_PORT}
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD}
      # Resolves ${OAUTH_REFRESH_TOKEN:} in lavalink/application.yml's oauth block. Komodo's
      # stack environment has this stored as LAVALINK_OAUTH_REFRESH_TOKEN, not bare
      # OAUTH_REFRESH_TOKEN - the unprefixed version here previously resolved to empty.
      - OAUTH_REFRESH_TOKEN=${LAVALINK_OAUTH_REFRESH_TOKEN:-}
    volumes:
      # No application.yml mount - it is baked into the image (see lavalink/Dockerfile), so
      # there is no host copy to keep in sync. plugins/ is the plugin jar download cache and
      # logs/ is rollover output; both are container-written state, not config.
      - /mnt/user/appdata/lyra/lavalink/plugins:/opt/Lavalink/plugins
      - /mnt/user/appdata/lyra/lavalink/logs:/opt/Lavalink/logs
    # Gates lyra-bot's start (see its depends_on). wget is busybox's, already in the alpine
    # base, so no extra layer. /version needs the Authorization header like every other v4
    # REST endpoint - without it Lavalink answers 401 and the check never goes healthy, which
    # strands lyra-bot in Created forever. $$LAVALINK_SERVER_PASSWORD (escaped) is read from
    # the container's own env at check time rather than interpolated into the compose config.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null --header="Authorization: $$LAVALINK_SERVER_PASSWORD" http://localhost:${SERVER_PORT:-2333}/version']
      interval: 5s
      timeout: 5s
      retries: 5
      # Plugin jars download on a cold cache volume, which is far slower than the ~4s a warm
      # boot takes. Failures before this elapses do not count against retries.
      start_period: 90s
    networks:
      - lyra-net

  lyra-bot:
    container_name: lyra-bot
    restart: unless-stopped
    image: ghcr.io/masonbesmer/lyra-sapphire:latest
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      # Optional: second bot token that owns voice receive. Unset disables receive.
      - DISCORD_LISTENER_TOKEN=${DISCORD_LISTENER_TOKEN:-}
      - OWNERS=${OWNERS}
      - NODE_ENV=${NODE_ENV}
      - BULK_OVERWRITE_GUILD_IDS=${BULK_OVERWRITE_GUILD_IDS}
      - SQLITE_PATH=${SQLITE_PATH}
      - LAVALINK_NODE_NAME=${LAVALINK_NODE_NAME}
      - LAVALINK_HOST=${LAVALINK_HOST}
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
      - LAVALINK_SECURE=${LAVALINK_SECURE}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI}
      - API_PORT=${API_PORT}
      - DASHBOARD_ORIGIN=${DASHBOARD_ORIGIN}
      - LAVALINK_RECONNECT_TRIES=${LAVALINK_RECONNECT_TRIES}
      - LAVALINK_RECONNECT_INTERVAL=${LAVALINK_RECONNECT_INTERVAL}
      - LAVALINK_REST_TIMEOUT=${LAVALINK_REST_TIMEOUT}
      # Speech-to-text sidecar for the voice assistant. Resolves over lyra-net.
      - STT_URL=${STT_URL:-http://stt:8000}
    # Without this the bot races Lavalink's boot on a stack redeploy and loses: Shoukaku 4.3.0
    # keeps the first attempt's connectError set even when a later retry succeeds, so it tears
    # down the good socket, and Shoukaku#addNode consumes the node's 'disconnect' to delete it
    # from shoukaku.nodes - leaving the pool permanently empty ("No nodes are online") until
    # the process restarts. Starting only once Lavalink answers avoids the whole sequence.
    depends_on:
      lavalink:
        condition: service_healthy
    volumes:
      - /mnt/user/appdata/lyra/data:/app/data
      - /mnt/user/appdata/lyra/recordings:/app/recordings
    networks:
      - lyra-net
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.lyra.entrypoints=https
      - traefik.http.routers.lyra.rule=Host(`lyra.latte.cx`)
      - traefik.http.routers.lyra.tls=true
      - traefik.http.services.lyra.loadbalancer.server.port=4000
      - nfrastack.herald.enable=true
    ports:
      - '4000:4000'

  # Self-hosted speech-to-text for the voice assistant.
  #
  # GPU access goes through CDI (Container Device Interface). This host exposes the card only
  # that way — `docker info` lists no nvidia runtime and no nvidia device driver, so both
  # `runtime: nvidia` and the compose-spec `deploy.resources.reservations.devices` block fail
  # ("unknown or invalid runtime name" and "could not select device driver" respectively).
  # The spec lives at /etc/cdi/nvidia.yaml; `nvidia-ctk cdi list` prints the device names.
  #
  # `nvidia.com/gpu=all` rather than the GPU UUID, so replacing the card does not need a
  # compose edit. Pin the UUID form if another container ever has to share the box.
  #
  # DEVICE=cuda is load-bearing as a safety net: if the GPU is not actually visible inside the
  # container, CTranslate2 raises at model load and the container dies loudly, rather than
  # quietly transcribing on CPU while looking GPU-configured.
  stt:
    build:
      context: ./docker/stt
    container_name: lyra-stt
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small.en}
      # float16 on the 2080 (compute capability 7.5). NEVER bfloat16 — unsupported there,
      # and it silently falls back to float32.
      - COMPUTE_TYPE=${COMPUTE_TYPE:-float16}
      - DEVICE=cuda
    volumes:
      # Weights persist across restarts; otherwise every deploy re-downloads the model.
      - /mnt/user/appdata/lyra/stt-models:/models
    networks:
      - lyra-net

networks:
  traefik:
    external: true
  # Renamed from lyra-network (2026-08-15) so the deploy creates a fresh bridge
  # whose iptables FORWARD rules land above libvirt's — the old network lost all
  # outbound traffic after the 08-14 host reboot. See docs/incidents/2026-08-15-dns-outage.md
  lyra-net:
    driver: bridge
