enableGlobalCache: true
enableScripts: true

nodeLinker: node-modules

packageExtensions:
  # discord-voip requires @discord-player/equalizer at module scope but does not
  # declare it, so `require('discord-voip')` throws MODULE_NOT_FOUND. That kills
  # the play/search/record/transcribe commands at load time. Declare it for them.
  discord-voip@*:
    dependencies:
      '@discord-player/equalizer': ^7.2.0
