services:
  lyra-sapphire:
    image: ghcr.io/masonbesmer/lyra-sapphire:latest
    pull_policy: always
    container_name: lyra-sapphire
    restart: unless-stopped

  # Self-hosted speech-to-text for the voice assistant. GPU by default.
  #
  # The compose-spec device reservation below suits a stock Docker host with the NVIDIA
  # Container Toolkit. docker-compose.prod.yml deliberately differs and uses a CDI device
  # (`nvidia.com/gpu=all`), because that host exposes the GPU only through CDI — it has no
  # nvidia runtime and no nvidia device driver, so this block fails there with "could not
  # select device driver". Both forms are correct for their host; do not unify them.
  stt:
    build: ./docker/stt
    container_name: lyra-stt
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small.en}
      # float16 on a 2080 Super (compute capability 7.5). NEVER bfloat16 — unsupported
      # there, and it silently falls back to float32.
      - COMPUTE_TYPE=${COMPUTE_TYPE:-float16}
      - DEVICE=cuda
    volumes:
      # Keep the weights across restarts; otherwise every boot re-downloads the model.
      - stt-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # CPU fallback for self-hosters without an NVIDIA GPU: `docker compose --profile stt-cpu up`.
  # Slower, but the feature works.
  stt-cpu:
    profiles: [stt-cpu]
    build:
      context: ./docker/stt
      args:
        BASE_IMAGE: ubuntu:22.04
    container_name: lyra-stt-cpu
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small.en}
      - COMPUTE_TYPE=int8
      - DEVICE=cpu
    volumes:
      - stt-models:/models

  # Self-hosted text-to-speech for the assistant's spoken acknowledgements. GPU by default,
  # like stt: Kokoro (82M params) synthesises well under real time on the card and Piper's
  # "faster than real time on two cores" did not hold up once the acks got longer than a
  # word or two. The reservation form below suits a stock Docker host with the NVIDIA
  # Container Toolkit; docker-compose.prod.yml uses a CDI device for the same reason stt
  # does there. Both forms are correct for their host; do not unify them.
  tts:
    build: ./docker/tts
    container_name: lyra-tts
    restart: unless-stopped
    environment:
      # Any voice bundled in https://huggingface.co/hexgrad/Kokoro-82M (af_heart, af_bella,
      # am_michael, bf_emma, …). The first letter is the accent and is read out separately.
      - KOKORO_VOICE=${KOKORO_VOICE:-af_heart}
      - KOKORO_DEVICE=cuda
    volumes:
      # Keep the weights across restarts; otherwise every boot re-downloads them.
      - tts-voices:/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # CPU fallback for self-hosters without an NVIDIA GPU: `docker compose --profile tts-cpu up`.
  # Slower — a short ack can take longer than it does to speak it — but the feature works.
  tts-cpu:
    profiles: [tts-cpu]
    build:
      context: ./docker/tts
      args:
        BASE_IMAGE: ubuntu:22.04
    container_name: lyra-tts-cpu
    restart: unless-stopped
    environment:
      - KOKORO_VOICE=${KOKORO_VOICE:-af_heart}
      - KOKORO_DEVICE=cpu
    volumes:
      - tts-voices:/voices

volumes:
  stt-models:
  tts-voices:
